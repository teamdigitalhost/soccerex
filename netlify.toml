[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Prerendering: serve pre-rendered HTML to crawlers and social bots.
# Enable via Netlify dashboard → Site configuration → Build & deploy → Prerendering.
# When active, Netlify intercepts requests from known crawler User-Agents and returns
# a headless-rendered snapshot so search engines and link-unfurlers see full content.
# No code change needed when toggling; this comment documents the intent.
#
# Explicit pass-throughs for static SEO files. Netlify serves files from dist/
# before evaluating redirect rules, so robots.txt and sitemap.xml are already safe,
# but declaring them as direct 200 routes makes the intent unambiguous.
[[redirects]]
  from = "/version.json"
  to = "/version.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# Old "Book your stay" links (print, email, the previous site) land on the accommodations page.
# 301: the move is permanent, so browsers and search engines can update the link.
[[redirects]]
  from = "/book-your-stay"
  to = "/accommodations"
  status = 301
  force = true

# The old hand-made agenda PDF was removed when the API started building one per
# request. Links to it are in print and email, so they follow to the live file.
[[redirects]]
  from = "/downloads/soccerex-miami-2026-agenda.pdf"
  to = "https://soccerex.digitalhost.co/api/v1/events/soccerex-miami-2026/agenda.pdf"
  status = 301
  force = true

# /portal forwards to the Eventify event portal for the current event (Miami 2026).
# 302 on purpose: the target changes each event cycle, keep browsers/crawlers re-checking.
[[redirects]]
  from = "/portal"
  to = "https://soccerexmiami2026.eventify.io/"
  status = 302
  force = true

# Admin-minted signed preview pages: keep them out of search indexes at the HTTP
# layer (the pages also inject a robots meta client-side, but headers are authoritative).
[[headers]]
  for = "/profile-preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/article-preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The HerSoccerex founding document at the link people share. Served as the PDF
# itself, so the address stays short and the file saves under a readable name.
[[redirects]]
  from = "/hersoccerex/founding-document"
  to = "/downloads/hersoccerex-founding-document.pdf"
  status = 200
  force = true

[[headers]]
  for = "/hersoccerex/founding-document"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"HerSoccerex Founding Document.pdf\""

[[headers]]
  for = "/downloads/hersoccerex-founding-document.pdf"
  [headers.values]
    Content-Disposition = "inline; filename=\"HerSoccerex Founding Document.pdf\""

# SPA fallback so React Router routes like /events, /about, /contact work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
